
name: Validate Agency Standards

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate:
    name: Check repository standards and template
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "CLAUDE.md"
            ".gitignore"
            ".claude/skills/plan/SKILL.md"
            ".claude/skills/implement/SKILL.md"
            ".claude/skills/agency-review/SKILL.md"
            "templates/client-project/CLAUDE.md"
            "templates/client-project/README.md"
            "templates/client-project/.gitignore"
            "templates/client-project/.env.example"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Verify skill metadata
        shell: bash
        run: |
          set -euo pipefail

          for skill in plan implement agency-review; do
            file=".claude/skills/$skill/SKILL.md"

            if ! grep -Fxq -- "---" "$file"; then
              echo "::error::Missing YAML frontmatter delimiter: $file"
              exit 1
            fi

            if ! grep -Fxq -- "name: $skill" "$file"; then
              echo "::error::Expected skill name '$skill' in $file"
              exit 1
            fi

            if ! grep -Eq '^description: .+' "$file"; then
              echo "::error::Missing skill description: $file"
              exit 1
            fi

            echo "Validated skill: $skill"
          done

      - name: Verify template safety
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fxq -- '.env' templates/client-project/.gitignore; then
            echo "::error::Template .gitignore must exclude .env"
            exit 1
          fi

          if ! grep -Fxq -- '!.env.example' templates/client-project/.gitignore; then
            echo "::error::Template .gitignore must allow .env.example"
            exit 1
          fi

          if grep -Eq '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=.+$' templates/client-project/.env.example; then
            echo "::error::Review .env.example for values that may be real credentials"
            exit 1
          fi

          echo "Template safety checks passed"
